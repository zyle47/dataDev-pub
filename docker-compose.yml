version: '3.7'

services:
  backend:
    build:
      context: ./backend
    volumes:
      - backend:/backend/uploads  # Persist uploaded images
      - backend_db:/backend/annotations_export  # Persist annotation exports
      - backend_data:/backend/data  # Persist SQLite database
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  backend:
    driver: local  # For uploads
  backend_db:
    driver: local  # For annotations_export
  backend_data:
    driver: local  # For SQLite database
